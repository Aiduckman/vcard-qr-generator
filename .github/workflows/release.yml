name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install py2app qrcode Pillow
      - name: Generate icons
        run: python make_icon.py
      - name: Build .app bundle
        run: python setup.py py2app
      - name: Zip the .app
        run: |
          cd dist
          zip -r "vCard-QR-Generator-macOS.zip" "vCard QR Generator.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/vCard-QR-Generator-macOS.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tkinter
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install deps
        run: pip install pyinstaller qrcode Pillow
      - name: Generate icons
        run: python make_icon.py
      - name: Build binary
        run: python build.py
      - name: Rename for download
        run: mv "dist/vCard QR Generator" "dist/vCard-QR-Generator-Linux"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/vCard-QR-Generator-Linux

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pyinstaller qrcode Pillow
      - name: Generate icons
        run: python make_icon.py
      - name: Build binary
        run: python build.py
      - name: Rename for download
        run: Move-Item "dist/vCard QR Generator.exe" "dist/vCard-QR-Generator-Windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/vCard-QR-Generator-Windows.exe

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos/vCard-QR-Generator-macOS.zip
            artifacts/linux/vCard-QR-Generator-Linux
            artifacts/windows/vCard-QR-Generator-Windows.exe
          generate_release_notes: true
